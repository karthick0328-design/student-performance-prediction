{% extends "base.html" %}

{% block title %}Error {{ error_code }} | AI Student Performance Prediction{% endblock %}
{% block page_heading %}Application Notice{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 3rem auto; text-align: center; padding: 2rem;">
  <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
  <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--text-main);">Error {{ error_code }}</h2>
  <p style="color: var(--text-muted); margin-bottom: 1.5rem;">{{ message }}</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
